name: Discord coordinator tests
on:
  push:
    branches: [main, feature/discord-dual-ai-coordinator]
  pull_request:
    branches: [main, feature/discord-dual-ai-coordinator]
    paths:
      - 'tools/discord_coordinator/**'
      - 'tests/test_discord_coordinator.py'
      - '.github/workflows/discord-coordinator.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # tests/conftest.py imports the live database key. That import needs
      # the two libraries pyproject.toml already declares. These tests
      # never open a database, so SQLCipher is not installed here.
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<10" "cryptography>=44" "argon2-cffi>=23.1.0"
      - run: python -m compileall -q tools/discord_coordinator
      - run: python -m pytest -q tests/test_discord_coordinator.py
        env:
          PYTHONPATH: src
