name: Discord coordinator tests
on:
  push:
    branches: [main, feature/discord-dual-ai-coordinator]
  pull_request:
    branches: [main, feature/discord-dual-ai-coordinator]
    paths:
      - 'tools/discord_coordinator/**'
      - 'tests/test_discord_coordinator.py'
      - '.github/workflows/discord-coordinator.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m compileall -q tools/discord_coordinator
      # tests/conftest.py imports freya, which is not installed here.
      - run: python -m pytest -q tests/test_discord_coordinator.py
        env:
          PYTHONPATH: src
